[project]
name = "factorymind"
version = "0.1.0"
description = "FactoryMind CDT: uncertainty-aware, evidence-grounded industrial decision support (research prototype)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.162.2",
    "numpy>=2.3",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=7.0.1",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "httpx2>=2.16.0",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factorymind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["factorymind"]
plugins = ["pydantic.mypy"]

# scikit-learn and joblib ship no type information.
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true
